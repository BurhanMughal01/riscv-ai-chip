name: Synthesize 32x32 NPU
on: [push, workflow_dispatch]
jobs:
  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y yosys
      - run: |
          yosys -p "read_verilog npu_32x32_top.v; synth -top npu_32x32_top; stat" 2>&1 | tail -50
